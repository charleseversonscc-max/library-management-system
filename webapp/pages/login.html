<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Library System</title>
<link href="../css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-nav"></div>
<div class="container py-5" style="max-width:420px">
  <div class="card card-lib p-4">
    <h2 class="text-center mb-4">Welcome back</h2>
    <div id="err" class="alert alert-danger d-none">Wrong username or password.</div>
    <form action="../login" method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-lib w-100">Log in</button>
    </form>
  </div>
</div>
<script>if(location.search.indexOf("error")>-1)document.getElementById("err").classList.remove("d-none");</script>
<div id="app-footer"></div>
<script src="../js/layout.js"></script>
</body>
</html>
